{% extends "base.html" %}{% block title %}Case Register | CETTP{% endblock %}
{% block content %}<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><div class="eyebrow">REGISTER</div><h1 class="page-title">Case Register</h1><p class="text-muted mb-0">Search and filter cancellation and endorsement requests.</p></div><div class="d-flex gap-2"><a class="btn btn-outline-success" href="{{ url_for('cases_export', q=q, status=status, type=case_type) }}">Download Case Register Excel</a><a class="btn btn-primary" href="{{ url_for('new_case') }}">＋ New request</a></div></div>
<div class="panel mb-4"><form class="row g-3 align-items-end" method="get"><div class="col-md-5"><label class="form-label">Search</label><input class="form-control" name="q" value="{{ q }}" placeholder="Reference, policy, customer or TRA reference"></div><div class="col-md-3"><label class="form-label">Workflow status</label><select class="form-select" name="status"><option value="">All statuses</option>{% for s in statuses %}<option value="{{ s }}" {{ 'selected' if status == s else '' }}>{{ s }}</option>{% endfor %}</select></div><div class="col-md-2"><label class="form-label">Request type</label><select class="form-select" name="type"><option value="">All types</option><option value="Cancellation" {{ 'selected' if case_type == 'Cancellation' else '' }}>Cancellation</option><option value="Endorsement" {{ 'selected' if case_type == 'Endorsement' else '' }}>Endorsement</option></select></div><div class="col-md-2 d-flex gap-2"><button class="btn btn-dark flex-grow-1">Filter</button><a class="btn btn-outline-secondary" href="{{ url_for('cases') }}">Reset</a></div></form></div>
<div class="panel">{% include "_case_table.html" %}</div>{% endblock %}
